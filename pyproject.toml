[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lyrics-engine"
version = "0.1.0"
description = "Extensible lyrics engine for music metadata applications"
requires-python = ">=3.12"
dependencies = [
    "mutagen",
    "requests",
]

[tool.setuptools.packages.find]
where = ["src"]
